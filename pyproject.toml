[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kedi-debugger"
version = "0.1.0"
description = "Optional stdio Debug Adapter Protocol backend for Kedi"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["kedi>=0.4,<0.5", "python-dotenv>=1.2.2,<2"]

[project.scripts]
kedi-debugger = "kedi_debugger.__main__:main"

[project.urls]
Documentation = "https://docs.kedi-lang.org/tooling/debugger/"
Source = "https://github.com/kedi-lang/kedi-debugger"
Tracker = "https://github.com/kedi-lang/kedi-debugger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_debugger"]

[tool.ruff]
line-length = 100
target-version = "py310"
